name: Refresh IND register

# The IND republishes its recognised-sponsor register once a month, and a
# browser can't fetch ind.nl directly (CORS). So the refresh happens here:
# re-scrape, commit only if something actually changed, then redeploy.

on:
  schedule:
    - cron: "17 4 5 * *" # 04:17 UTC on the 5th of each month
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Fetch and parse the register
        # --strict: fail loudly rather than silently keeping stale data
        run: node scripts/build-data.mjs --strict

      - name: Did anything change?
        id: diff
        run: |
          if git diff --quiet -- public/sponsors.json public/companies-resolved.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Register unchanged — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/
          fi

      - name: Commit updated register
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sponsors.json public/companies-resolved.json
          git commit -m "chore: refresh IND register $(date -u +%Y-%m-%d)"
          git push

  # Republish so the live site picks up the new register.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
