name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # used by refresh-register.yml after it updates the data

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel one that's mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install, not npm ci: a lock file generated on macOS omits the
      # linux-only native binaries Tailwind depends on, which makes `npm ci`
      # refuse to run on the ubuntu runner.
      - run: npm install --no-audit --no-fund
      - name: Build static site
        env:
          # GitHub Pages serves a project site from /<repo>
          NEXT_PUBLIC_BASE_PATH: /vaj
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
